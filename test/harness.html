<!DOCTYPE html>
<!-- 本地验证页：不经 Chrome 扩展机制，直接用同一套 vendor + renderer.js 渲染 sample.md。
     用法：在 mdvis 目录起 python3 -m http.server 8000，访问
     http://localhost:8000/test/harness.html -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>mdvis harness</title>
</head>
<body>
<script src="../vendor/markdown-it.min.js"></script>
<script src="../vendor/markdown-it-emoji.min.js"></script>
<script src="../vendor/highlight.min.js"></script>
<script src="../vendor/mermaid.min.js"></script>
<script src="../renderer.js"></script>
<script>
(async function () {
  const [raw, css] = await Promise.all([
    fetch('sample.md').then(r => r.text()),
    fetch('../styles.css').then(r => r.text())
  ]);
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
  document.documentElement.classList.add('mdvis-rendered');

  const container = document.createElement('div');
  container.className = 'mdvis-container';
  container.innerHTML = window.MDVisRenderer.renderMarkdown(raw);
  document.body.innerHTML = '';
  document.body.appendChild(container);
  await window.MDVisRenderer.renderMermaid(container);
  document.title = 'mdvis harness — done';
})();
</script>
</body>
</html>
